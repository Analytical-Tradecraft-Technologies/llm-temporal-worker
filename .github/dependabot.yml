# Check at 06:00 Sydney every calendar day.
version: 2
updates:
- package-ecosystem: gomod
  directory: /golang
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
  groups:
    opentelemetry:
      patterns:
      - go.opentelemetry.io/*
    aws-sdk-go-v2:
      patterns:
      - github.com/aws/aws-sdk-go-v2
      - github.com/aws/aws-sdk-go-v2/*
      - github.com/aws/smithy-go
    azure-sdk-for-go:
      patterns:
      - github.com/Azure/azure-sdk-for-go/sdk/*
      - github.com/AzureAD/microsoft-authentication-library-for-go
    prometheus:
      patterns:
      - github.com/prometheus/*
    temporal:
      patterns:
      - go.temporal.io/*
    cloud-storage:
      patterns:
      - github.com/Analytical-Tradecraft-Technologies/cloud-storage/*
- package-ecosystem: docker
  directories:
  - /golang
  - /golang/deploy/local/provider-mock
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
    exclude:
    - library/golang
  groups:
    shared-dependency:
      group-by: dependency-name
- package-ecosystem: docker-compose
  directory: /golang
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
  groups:
    artifact-actions:
      patterns:
      - actions/upload-artifact
      - actions/download-artifact
