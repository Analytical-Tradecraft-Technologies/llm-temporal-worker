# Check at 00:00, 08:00 and 16:00 Sydney every calendar day.
version: 2
updates:
- package-ecosystem: gomod
  directory: /golang
  schedule:
    interval: cron
    cronjob: 0 */8 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
  groups:
    opentelemetry-core:
      patterns:
      - go.opentelemetry.io/otel
      - go.opentelemetry.io/otel/metric
      - go.opentelemetry.io/otel/trace
      - go.opentelemetry.io/otel/sdk
      - go.opentelemetry.io/otel/exporters/otlp/otlptrace
      - go.opentelemetry.io/otel/exporters/otlp/otlptrace/otlptracegrpc
- package-ecosystem: docker
  directories:
  - /golang
  - /golang/deploy/local/provider-mock
  schedule:
    interval: cron
    cronjob: 0 */8 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
    exclude:
    - library/golang
  groups:
    shared-dependency:
      group-by: dependency-name
- package-ecosystem: docker-compose
  directory: /golang
  schedule:
    interval: cron
    cronjob: 0 */8 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: cron
    cronjob: 0 */8 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
