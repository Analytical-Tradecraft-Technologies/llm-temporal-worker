# Check at 06:00 Sydney every calendar day.
version: 2
updates:
- package-ecosystem: gomod
  directory: /golang
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
  groups:
    opentelemetry:
      patterns:
      - go.opentelemetry.io/*
- package-ecosystem: docker
  directories:
  - /golang
  - /golang/deploy/local/provider-mock
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
    exclude:
    - library/golang
  groups:
    shared-dependency:
      group-by: dependency-name
- package-ecosystem: docker-compose
  directory: /golang
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
