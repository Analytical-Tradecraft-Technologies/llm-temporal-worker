# Check at 06:00 Sydney every calendar day.
version: 2
updates:
- package-ecosystem: gomod
  directory: /golang
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
  # Every Go bump rewrites golang/go.mod and go.sum, so separate PRs queued
  # together drop out of the merge queue with merge_conflict. Batch all minor
  # and patch bumps (OpenTelemetry core included) into one PR; majors stay
  # separate because they can need code changes.
  groups:
    go-minor-and-patch:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
- package-ecosystem: docker
  directories:
  - /golang
  - /golang/deploy/local/provider-mock
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
    exclude:
    - library/golang
  groups:
    shared-dependency:
      group-by: dependency-name
- package-ecosystem: docker-compose
  directory: /golang
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: cron
    cronjob: 0 6 * * *
    timezone: Australia/Sydney
  cooldown:
    default-days: 3
