name: Master

on:
  push:
    branches:
      - master
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
      timezone: Australia/Sydney

permissions:
  contents: read

# Every master push needs its own completed run: the release guard requires a
# successful push run whose head_sha is the tagged commit. Push runs therefore
# get a per-commit group and are never cancelled (a shared group would still
# replace a pending run). Scheduled and manual runs keep superseding each other.
concurrency:
  group: master-${{ github.event_name }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  container:
    name: Container image
    outputs:
      digest: ${{ steps.published.outputs.digest }}
      amd64_digest: ${{ steps.published.outputs.amd64_digest }}
    if: github.ref == 'refs/heads/master'
    needs: [verify, verify-static, verify-race, verify-race-repeat, verify-cloud-workflow, verify-redis, verify-image, ocaml, fuzz-shard]
    environment: docker_push
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Docker Build Cloud
        env:
          DOCKER_ACCOUNT: ${{ vars.DOCKER_ACCOUNT }}
          DOCKER_CLOUD_BUILDER: ${{ vars.DOCKER_CLOUD_BUILDER }}
          DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: bash scripts/ci/setup-build-cloud.sh

      - name: Resolve image build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'version=%s.%s\n' "$(date -u +%Y%m%d)" "$GITHUB_RUN_NUMBER"
            printf 'revision=%s\n' "$GITHUB_SHA"
            printf 'build_time=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            printf 'source=https://github.com/%s\n' "$GITHUB_REPOSITORY"
            printf 'go_version=%s\n' "go$(cat golang/.go-version)"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push multi-platform image
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build \
            --file ./golang/Dockerfile \
            --builder "$BUILDX_BUILDER" \
            --platform linux/amd64,linux/arm64 \
            --tag analyticaltradecraft/llm-temporal-worker:${{ steps.metadata.outputs.version }} \
            --push --pull --provenance=mode=max --sbom=true \
            --metadata-file "$RUNNER_TEMP/published-image.json" \
            --build-arg VERSION=${{ steps.metadata.outputs.version }} \
            --build-arg REVISION=${{ steps.metadata.outputs.revision }} \
            --build-arg BUILD_TIME=${{ steps.metadata.outputs.build_time }} \
            --build-arg SOURCE=${{ steps.metadata.outputs.source }} \
            --build-arg GO_VERSION=${{ steps.metadata.outputs.go_version }} \
            ./golang

      - name: Verify published architectures and record digest
        id: published
        env:
          IMAGE_TAG: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="analyticaltradecraft/llm-temporal-worker"
          digest="$(jq -er '."containerimage.digest"' "$RUNNER_TEMP/published-image.json")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          docker buildx imagetools inspect "$image@$digest" --raw > "$RUNNER_TEMP/published-manifest.json"
          jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]' \
            "$RUNNER_TEMP/published-manifest.json"
          amd64_digest="$(jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest' "$RUNNER_TEMP/published-manifest.json")"
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\namd64_digest=%s\n' "$digest" "$amd64_digest" >> "$GITHUB_OUTPUT"
          # Literal Markdown backticks in the summary are intentional.
          # shellcheck disable=SC2016
          printf 'Published `%s:%s`\n\nDigest: `%s`\n\nPlatforms: `linux/amd64`, `linux/arm64`\n' \
            "$image" "$IMAGE_TAG" "$digest" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove Docker Cloud credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/llmtw-cloud-docker"

  ocaml:
    name: OCaml package
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install Protocol Buffers compiler
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler bubblewrap
          sudo apt-get install --yes cargo

      - name: Enable unprivileged user namespaces for OPAM sandboxing
        if: ${{ runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          set -euo pipefail
          for setting in \
            kernel.unprivileged_userns_clone=1 \
            kernel.apparmor_restrict_unprivileged_userns=0; do
            key="${setting%=*}"
            want="${setting#*=}"
            if current="$(sysctl -n "${key}" 2>/dev/null)" && [[ "${current}" != "${want}" ]]; then
              sudo sysctl -w "${key}=${want}"
            fi
          done

      - name: Verify OCaml Temporal dependency pin parity
        run: bash scripts/check-ocaml-temporal-pin.sh

      - name: Restore isolated OPAM root
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/llmtw-opam-root
            ${{ runner.temp }}/llmtw-xdg-cache
          key: opam-${{ runner.os }}-${{ runner.arch }}-${{ github.repository }}-master-opam-2.3.0-ocaml-5.2.0-sandboxed-${{ hashFiles('ocaml/llm_temporal_worker/*.opam', 'ocaml/llm_temporal_worker/dune-project', 'scripts/ci/setup-opam.sh') }}

      - name: Set up OCaml
        run: bash scripts/ci/setup-opam.sh

      - name: Install pinned nested package dependencies
        working-directory: ocaml/llm_temporal_worker
        run: |
          set -euo pipefail
          opam pin add --yes --no-action --kind=git temporal-sdk \
            'git+https://github.com/Analytical-Tradecraft-Technologies/ocaml-temporal.git#0d3f618590ed09501b004d5052b7bd88b81e2723'
          bash ../../scripts/ci/prefetch-temporal-sdk-cargo.sh
          CARGO_NET_OFFLINE=true opam install --yes . --deps-only

      - name: Build and test nested package
        working-directory: ocaml/llm_temporal_worker
        run: |
          set -euo pipefail
          opam exec -- dune build
          opam exec -- dune runtest

      - name: Prove remote Git subpath installation
        env:
          PACKAGE_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          opam pin add --yes --kind=git llm-temporal-ocaml \
            "git+https://github.com/${GITHUB_REPOSITORY}.git#${PACKAGE_REF}" \
            --subpath=ocaml/llm_temporal_worker
          opam install --yes --with-test llm-temporal-ocaml

      - name: Build downstream Dune consumer
        run: opam exec -- dune build --root ocaml/consumer_smoke

      - name: Run downstream consumer smoke
        run: opam exec -- dune runtest --root ocaml/consumer_smoke

      - name: Compile downstream workflow sample
        run: opam exec -- dune build --root ocaml/consumer_workflow_smoke

      - name: Set up Go for OCaml workflow interoperability
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: golang/.go-version
          cache: true
          cache-dependency-path: golang/go.sum

      - name: Test native OCaml clients and child workflows with Temporal and Redis
        working-directory: golang
        run: make cloud-workflow-ocaml-integration

  fuzz-shard:
    name: Fuzz shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: golang/.go-version
          cache: true
          cache-dependency-path: golang/go.sum

      - name: Run bounded semantic fuzz shard
        working-directory: golang
        run: FUZZ_TIME=250000x bash ../scripts/release/run-gate.sh fuzz_summary "$RUNNER_TEMP/fuzz-evidence/fuzz-${{ matrix.shard }}.json" bash scripts/run-fuzz.sh shard "${{ matrix.shard }}"

      - name: Retain successful fuzz evidence
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-evidence-${{ matrix.shard }}
          path: ${{ runner.temp }}/fuzz-evidence/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # Master verification is split into independent jobs that run concurrently.
  # Each job checks out and sets up its own toolchain. The aggregating
  # `verify` job below keeps the historical "Verify" job name and fails unless
  # every split job succeeded; publication and release evidence additionally
  # need every split job directly, so nothing publishes with less gating than
  # the former single sequential job.
  verify-static:
    name: Verify static checks and build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Validate documentation
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/index.md
          test -f docs/superpowers/plans/2026-07-13-master-sequence.md
          if grep -R -n -E '(TBD|TODO|FIXME|PLACEHOLDER)' docs README.md; then
            echo "Planning placeholders are not allowed."
            exit 1
          fi
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          root = pathlib.Path.cwd().resolve()
          missing = []
          pattern = re.compile(r"(?<!!)\[[^\]]+\]\(([^)]+)\)")
          files = [root / "README.md", *sorted((root / "docs").rglob("*.md"))]
          for source in files:
              text = source.read_text(encoding="utf-8")
              for raw in pattern.findall(text):
                  target = raw.strip().split(maxsplit=1)[0].strip("<>")
                  if (
                      not target
                      or target.startswith(("#", "https://", "http://", "mailto:"))
                  ):
                      continue
                  path_text = target.split("#", 1)[0]
                  destination = (source.parent / path_text).resolve()
                  if root not in (destination, *destination.parents):
                      missing.append(f"{source.relative_to(root)}: escapes repository: {raw}")
                  elif not destination.exists():
                      missing.append(f"{source.relative_to(root)}: missing: {raw}")
          if missing:
              print("\n".join(missing), file=sys.stderr)
              raise SystemExit(1)
          PY
          test "$(grep -o -F 'economy | standard | priority' docs/decisions/0002-service-classes.md | wc -l | tr -d ' ')" -eq 1

      - name: Detect Go implementation
        id: go
        shell: bash
        run: |
          if [[ -f golang/go.mod ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.go.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: golang/.go-version
          cache: true
          cache-dependency-path: golang/go.sum

      - name: Set up pinned kubectl for deployment policy
        if: steps.go.outputs.present == 'true'
        run: bash scripts/ci/setup-kubectl.sh

      - name: Verify workflow policy
        if: steps.go.outputs.present == 'true'
        working-directory: golang
        run: make workflow-verify

      - name: Check Go formatting
        if: steps.go.outputs.present == 'true'
        working-directory: golang
        shell: bash
        run: bash scripts/check-go-format.sh

      - name: Verify schemas and documentation
        if: steps.go.outputs.present == 'true'
        working-directory: golang
        run: |
          make schema-verify
          make docs-verify

      - name: Verify rendered Kubernetes deployment policy
        if: steps.go.outputs.present == 'true'
        working-directory: golang
        run: make deployment-policy-verify

      - name: Vet
        if: steps.go.outputs.present == 'true'
        working-directory: golang
        run: go vet ./...

      - name: Check local OpenAI smoke offline
        if: steps.go.outputs.present == 'true'
        run: make openai-smoke-check

      - name: Compile guarded live-provider harness
        if: steps.go.outputs.present == 'true'
        working-directory: golang
        run: go test -tags=live ./integration/live -run '^$'

      - name: Verify guarded live-provider harness offline
        if: steps.go.outputs.present == 'true'
        working-directory: golang
        run: make live-contract-verify

      - name: Compile guarded Redis benchmark
        if: steps.go.outputs.present == 'true'
        working-directory: golang
        run: make redis-benchmark-compile

      - name: Build worker
        if: steps.go.outputs.present == 'true'
        working-directory: golang
        run: go build ./...

  verify-race:
    name: Verify with race detector
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The v1 traceability validator proves recorded evidence fresh from
          # git history, so this full-suite job needs every commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Go implementation
        id: go
        shell: bash
        run: |
          if [[ -f golang/go.mod ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.go.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: golang/.go-version
          cache: true
          cache-dependency-path: golang/go.sum

      - name: Test with race detector
        if: steps.go.outputs.present == 'true'
        working-directory: golang
        run: |
          bash ../scripts/release/run-gate.sh race_summary "$RUNNER_TEMP/verified-inputs/race-summary.json" go test -race ./... -timeout 20m
          # The race run also executes the full test suite; retain both facts.
          python3 - <<'PYTHON'
          import json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "verified-inputs"
          summary = json.loads((root / "race-summary.json").read_text())
          summary["kind"] = "test_summary"
          (root / "test-summary.json").write_text(json.dumps(summary) + "\n")
          PYTHON

      - name: Retain successful race and test evidence
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-inputs-race
          path: ${{ runner.temp }}/verified-inputs/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  # This job always runs on master so publication can need it, but it only
  # does work on the daily schedule. A job-level schedule condition would mark
  # it skipped on pushes and thereby skip every job that needs it.
  verify-race-repeat:
    name: Verify scheduled race repetition
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        if: github.event_name == 'schedule'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          # The v1 traceability validator proves recorded evidence fresh from
          # git history, so this full-suite job needs every commit.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect Go implementation
        if: github.event_name == 'schedule'
        id: go
        shell: bash
        run: |
          if [[ -f golang/go.mod ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: github.event_name == 'schedule' && steps.go.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: golang/.go-version
          cache: true
          cache-dependency-path: golang/go.sum

      - name: Scheduled test repetition
        if: github.event_name == 'schedule' && steps.go.outputs.present == 'true'
        working-directory: golang
        # The primary race pass in verify-race already exercises the
        # production-shaped 10,000-turn lineage stress proof once. Repeating
        # that test five times makes the scheduled suite exceed Go's default
        # 10-minute package timeout, so repeat the remainder without weakening
        # the primary gate. The cloud-runtime package alone takes about three
        # minutes per race iteration, so the repetition needs an explicit
        # package timeout.
        run: go test -race -count=5 -timeout 30m -skip '^TestCheckpointGraphReplaysLongLineageWithSnapshotsAndForks$' ./...

  verify-cloud-workflow:
    name: Verify cloud workflow integration
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Detect Go implementation
        id: go
        shell: bash
        run: |
          if [[ -f golang/go.mod ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.go.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: golang/.go-version
          cache: true
          cache-dependency-path: golang/go.sum

      - name: Run cloud workflow integration with Temporal and Redis
        if: steps.go.outputs.present == 'true'
        working-directory: golang
        run: make cloud-workflow-integration

  verify-redis:
    name: Verify Redis integration
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Detect Go implementation
        id: go
        shell: bash
        run: |
          if [[ -f golang/go.mod ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.go.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: golang/.go-version
          cache: true
          cache-dependency-path: golang/go.sum

      - name: Run trusted Redis shared-state conformance
        if: steps.go.outputs.present == 'true'
        working-directory: golang
        run: make redis-integration

      - name: Run trusted Redis readiness recovery
        if: steps.go.outputs.present == 'true'
        working-directory: golang
        run: make readiness-integration

  verify-image:
    name: Verify Compose lifecycle and hardened image
    if: github.ref == 'refs/heads/master'
    environment: docker_push
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Detect Go implementation
        id: go
        shell: bash
        run: |
          if [[ -f golang/go.mod ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.go.outputs.present == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: golang/.go-version
          cache: true
          cache-dependency-path: golang/go.sum

      - name: Set up Docker Build Cloud
        env:
          DOCKER_ACCOUNT: ${{ vars.DOCKER_ACCOUNT }}
          DOCKER_CLOUD_BUILDER: ${{ vars.DOCKER_CLOUD_BUILDER }}
          DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
        run: bash scripts/ci/setup-build-cloud.sh

      - name: Run authorized Compose lifecycle
        if: steps.go.outputs.present == 'true'
        working-directory: golang
        run: RELEASE_COMPOSE_EVIDENCE_DIR="$RUNNER_TEMP/verified-inputs" LLMTW_COMPOSE_LIVE=1 make compose-live-integration

      - name: Detect container
        id: container
        shell: bash
        run: |
          if [[ -f golang/Dockerfile ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify hardened container
        if: steps.container.outputs.present == 'true'
        working-directory: golang
        run: make image-verify

      - name: Retain successful Compose evidence
        if: github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-inputs-compose
          path: ${{ runner.temp }}/verified-inputs/
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: Remove Docker Cloud credentials
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/llmtw-cloud-docker"

  # Aggregate gate that preserves the "Verify" job name. It runs even when a
  # split job fails so that it reports failure rather than being skipped.
  verify:
    name: Verify
    if: always() && github.ref == 'refs/heads/master'
    needs: [verify-static, verify-race, verify-race-repeat, verify-cloud-workflow, verify-redis, verify-image]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every split verification job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        shell: bash
        run: |
          set -euo pipefail
          jq -r 'to_entries[] | "\(.key): \(.value.result)"' <<<"$NEEDS"
          jq -e 'length == 6 and all(.[]; .result == "success")' <<<"$NEEDS" >/dev/null

  # This produces a retained, redacted evidence bundle only after the normal
  # master verification jobs. It is intentionally excluded from manual,
  # scheduled, and pull-request executions, and does not publish or sign.
  release-evidence:
    name: Release evidence
    environment: docker_push
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [verify, verify-static, verify-race, verify-race-repeat, verify-cloud-workflow, verify-redis, verify-image, fuzz-shard, container]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: golang/.go-version
          cache: true
          cache-dependency-path: golang/go.sum

      - name: Download successful verification evidence from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: verified-inputs-*
          path: verified-inputs
          merge-multiple: true

      - name: Download successful fuzz evidence from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: fuzz-evidence-*
          path: fuzz-inputs
          merge-multiple: true

      - name: Combine all three successful fuzz shards
        run: |
          python3 scripts/release/merge-fuzz.py fuzz-inputs verified-inputs/fuzz-summary.json

      - name: Set up pinned kubectl for local manifest rendering
        run: bash scripts/ci/setup-kubectl.sh

      - name: Collect compact redacted release inputs
        env:
          RELEASE_EVIDENCE_KUBECTL_VERSION: v1.32.6
        run: |
          bash scripts/release/collect.sh \
            --artifact-dir release-artifacts \
            --image-oci-layout "$RUNNER_TEMP/image.oci" \
            --verified-inputs verified-inputs

      - name: Download published Linux AMD64 image without rebuilding
        env:
          PUBLISHED_DIGEST: ${{ needs.container.outputs.amd64_digest }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHED_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          sudo apt-get update
          sudo apt-get install --yes skopeo
          skopeo --command-timeout 5m copy --preserve-digests \
            "docker://docker.io/analyticaltradecraft/llm-temporal-worker@$PUBLISHED_DIGEST" \
            "oci:$RUNNER_TEMP/image.oci"

      - name: Inspect immutable OCI manifest descriptor
        id: image
        env:
          PUBLISHED_DIGEST: ${{ needs.container.outputs.amd64_digest }}
        working-directory: golang
        shell: bash
        run: |
          set -euo pipefail
          digest="$(go run ./tools/releaseverify layout-digest -layout "$RUNNER_TEMP/image.oci")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "temporary OCI directory returned an invalid manifest digest" >&2
            exit 1
          fi
          [[ "$digest" == "$PUBLISHED_DIGEST" ]] || { echo "Downloaded image differs from published digest" >&2; exit 1; }
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
          printf 'reference=docker.io/analyticaltradecraft/llm-temporal-worker@%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Set up pinned Syft
        run: bash scripts/ci/setup-syft.sh

      - name: Generate and bind CycloneDX SBOM for temporary OCI directory
        shell: bash
        run: |
          set -euo pipefail
          syft oci-dir:"$RUNNER_TEMP/image.oci" -o cyclonedx-json > "$RUNNER_TEMP/sbom.cdx.json"
          python3 scripts/release/collect.py annotate-sbom \
            --input "$RUNNER_TEMP/sbom.cdx.json" \
            --output release-artifacts/sbom.cdx.json \
            --reference "${{ steps.image.outputs.reference }}" \
            --digest "${{ steps.image.outputs.digest }}"

      - name: Set up pinned Trivy
        run: bash scripts/ci/setup-trivy.sh

      - name: Scan temporary OCI directory with pinned Trivy
        shell: bash
        run: |
          set -euo pipefail
          trivy image \
            --input "$RUNNER_TEMP/image.oci" \
            --format json \
            --output "$RUNNER_TEMP/image-scan.json" \
            --config scripts/release/trivy.yaml \
            --cache-dir "$TRIVY_CACHE_DIR"

      - name: Bind Trivy result to temporary OCI descriptor
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/release/collect.py annotate-scan \
            --input "$RUNNER_TEMP/image-scan.json" \
            --output release-artifacts/image-scan.json \
            --reference "${{ steps.image.outputs.reference }}" \
            --digest "${{ steps.image.outputs.digest }}"

      - name: Record and verify redacted release evidence
        shell: bash
        run: |
          set -euo pipefail
          # The trusted job has no production metrics access. If a protected
          # operator-run collection supplies worker-error-summary.json, retain
          # it; otherwise leave the worker SLO explicitly unrecorded.
          worker_error_artifact_args=()
          if [[ -f release-artifacts/worker-error-summary.json ]]; then
            worker_error_artifact_args=(-artifact worker_error_summary=worker-error-summary.json)
          fi
          bash scripts/release/record.sh \
            -artifact-dir release-artifacts \
            -output release-artifacts/evidence.json \
            -repository "https://github.com/${GITHUB_REPOSITORY}" \
            -revision "$GITHUB_SHA" \
            -image-reference "${{ steps.image.outputs.reference }}" \
            -image-digest "${{ steps.image.outputs.digest }}" \
            -artifact test_summary=test-summary.json \
            -artifact race_summary=race-summary.json \
            -artifact fuzz_summary=fuzz-summary.json \
            -artifact benchmark_summary=benchmark-summary.json \
            -artifact fixture_manifest=fixture-manifest.json \
            -artifact redis_summary=redis-summary.json \
            -artifact temporal_summary=temporal-summary.json \
            -artifact compose_summary=compose-summary.json \
            -artifact redis_log=redis-log.json \
            -artifact temporal_log=temporal-log.json \
            -artifact compose_log=compose-log.json \
            -artifact rendered_manifests=rendered-manifests.json \
            -artifact dependency_license=dependencies.json \
            -artifact sbom=sbom.cdx.json \
            -artifact image_scan=image-scan.json \
            ${worker_error_artifact_args[@]:+"${worker_error_artifact_args[@]}"}
          make release-verify

      - name: Retain validated redacted release evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-evidence
          path: release-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary OCI directory
        if: always()
        shell: bash
        run: rm -rf -- "$RUNNER_TEMP/image.oci"
