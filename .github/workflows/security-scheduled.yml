name: Scheduled security review

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"
      timezone: Australia/Sydney

permissions:
  contents: read

concurrency:
  group: scheduled-security
  cancel-in-progress: true

jobs:
  security:
    name: Scan current master dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: golang/.go-version
          cache: true
          cache-dependency-path: golang/go.sum

      - name: Scan current dependencies and enforce exception expiry
        working-directory: golang
        run: make security-verify
