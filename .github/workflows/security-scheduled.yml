name: Scheduled security review

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *"
      timezone: Australia/Sydney

permissions:
  contents: read

concurrency:
  group: scheduled-security
  cancel-in-progress: true

jobs:
  security:
    name: Scan current master dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: golang/.go-version
          cache: true
          cache-dependency-path: golang/go.sum

      - name: Scan current dependencies and enforce exception expiry
        working-directory: golang
        run: make security-verify
