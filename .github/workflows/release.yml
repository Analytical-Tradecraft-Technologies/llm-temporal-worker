name: Guarded digest publication

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: Exact protected release tag ref, for example refs/tags/v1.2.3
        required: true
        type: string
      image_reference:
        description: Fully qualified trusted registry/repository digest reference
        required: true
        type: string
      evidence_run_id:
        description: Successful master release-evidence workflow run ID
        required: true
        type: string

# No job receives write permissions by default. Each boundary gets Actions read
# access only while independently retrieving the one named evidence artifact;
# only the environment-protected publisher can request a GitHub OIDC token.
permissions:
  contents: read

concurrency:
  group: guarded-publication-${{ inputs.release_ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Validate guarded publication request
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    steps:
      # Validate the only manual ref before it is ever passed to Git. The
      # protected workflow then fetches a fixed public repository URL without
      # a credential and checks out only the trusted master revision.
      - name: Validate release reference before anonymous fetch
        id: release-ref
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'release_ref=%s\n' "$RELEASE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "release_ref must be an exact refs/tags/vMAJOR.MINOR.PATCH reference" >&2
            exit 1
          fi

      # actions/checkout v6 requires a token input, even for a public
      # repository. Keep the automatic GitHub token's only sink below by
      # bootstrapping a credential-free checkout from the fixed public URL.
      - name: Check out fixed public master anonymously
        shell: bash
        env:
          RELEASE_REF: ${{ steps.release-ref.outputs.release_ref }}
          TRUSTED_MASTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)" || {
            echo "anonymous checkout requires an empty workspace" >&2
            exit 1
          }
          if [[ ! "$TRUSTED_MASTER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "protected workflow revision is invalid" >&2
            exit 1
          fi
          export HOME="$RUNNER_TEMP/anonymous-git-home"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS=/bin/false
          mkdir -p "$HOME"
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin https://github.com/mfow/llm-temporal-worker.git
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c http.extraHeader= fetch --no-tags --force origin \
            +refs/heads/master:refs/remotes/origin/master \
            "$RELEASE_REF:$RELEASE_REF"
          fetched_master="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify refs/remotes/origin/master)"
          if [[ "$fetched_master" != "$TRUSTED_MASTER_SHA" ]]; then
            echo "public master moved after this protected workflow started" >&2
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE" show-ref --verify --quiet "$RELEASE_REF"
          git -C "$GITHUB_WORKSPACE" checkout --detach --force "$TRUSTED_MASTER_SHA"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: golang/.go-version
          token: ""
          cache: "false"

      - name: Validate immutable manual inputs
        id: request
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          RELEASE_PUBLICATION_IMAGE_REPOSITORY: ${{ vars.RELEASE_PUBLICATION_IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail
          bash scripts/release/guard.sh validate-request \
            --release-ref "$RELEASE_REF" \
            --image-reference "$IMAGE_REFERENCE" \
            --evidence-run-id "$EVIDENCE_RUN_ID" \
            --trusted-repository "$RELEASE_PUBLICATION_IMAGE_REPOSITORY" \
            --output "$GITHUB_OUTPUT"

      # The public run lookup is an unauthenticated HTTPS GET. It validates the
      # master evidence workflow identity before the one job-scoped GitHub token
      # use below. Network, rate-limit, or metadata-validation errors fail closed.
      - name: Verify public master evidence run metadata
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          TAG_COMMIT: ${{ steps.request.outputs.tag_commit }}
        run: |
          set -euo pipefail
          bash scripts/release/guard.sh verify-public-run \
            --repository "$REPOSITORY" \
            --evidence-run-id "$EVIDENCE_RUN_ID" \
            --tag-commit "$TAG_COMMIT"

      # This is the only explicit use of the automatic, job-scoped GitHub
      # token. The pinned official action receives it directly; no shell or
      # other action receives the token. The master workflow contract allows
      # this artifact name only from the successful master release-evidence job.
      - name: Download the named trusted evidence artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.evidence_run_id }}
          path: release-artifacts

      - name: Run Task 19 through Task 22 safety gates
        shell: bash
        working-directory: golang
        run: |
          set -euo pipefail
          make security-verify
          make workflow-verify
          make deployment-policy-verify
          make image-verify

      - name: Verify Task 23 evidence binds the exact publication digest
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
          TAG_COMMIT: ${{ steps.request.outputs.tag_commit }}
        run: |
          set -euo pipefail
          make release-verify
          bash scripts/release/guard.sh verify-evidence \
            --evidence release-artifacts/evidence.json \
            --tag-commit "$TAG_COMMIT" \
            --image-reference "$IMAGE_REFERENCE"

  protected-signing-publication:
    name: Protected digest publication boundary
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: release-publication
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      published-image: ${{ steps.publish.outputs.published_image }}
      published-tag: ${{ steps.finalize.outputs.published_tag }}
    steps:
      # The protected job does not trust the unprivileged preflight workspace,
      # artifacts, or outputs. It independently repeats the anonymous trusted
      # checkout and every binding from tag and master to evidence and digest.
      - name: Validate release reference before anonymous fetch
        id: release-ref
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
        run: |
          set -euo pipefail
          if [[ "$RELEASE_REF" =~ ^refs/tags/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'release_ref=%s\n' "$RELEASE_REF" >> "$GITHUB_OUTPUT"
          else
            echo "release_ref must be an exact refs/tags/vMAJOR.MINOR.PATCH reference" >&2
            exit 1
          fi

      - name: Check out fixed public master anonymously
        shell: bash
        env:
          RELEASE_REF: ${{ steps.release-ref.outputs.release_ref }}
          TRUSTED_MASTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -z "$(find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -print -quit)" || {
            echo "anonymous checkout requires an empty workspace" >&2
            exit 1
          }
          if [[ ! "$TRUSTED_MASTER_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "protected workflow revision is invalid" >&2
            exit 1
          fi
          export HOME="$RUNNER_TEMP/anonymous-git-home"
          export GIT_CONFIG_NOSYSTEM=1
          export GIT_TERMINAL_PROMPT=0
          export GIT_ASKPASS=/bin/false
          mkdir -p "$HOME"
          git init --quiet "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin https://github.com/mfow/llm-temporal-worker.git
          git -C "$GITHUB_WORKSPACE" -c credential.helper= -c http.extraHeader= fetch --no-tags --force origin \
            +refs/heads/master:refs/remotes/origin/master \
            "$RELEASE_REF:$RELEASE_REF"
          fetched_master="$(git -C "$GITHUB_WORKSPACE" rev-parse --verify refs/remotes/origin/master)"
          if [[ "$fetched_master" != "$TRUSTED_MASTER_SHA" ]]; then
            echo "public master moved after this protected workflow started" >&2
            exit 1
          fi
          git -C "$GITHUB_WORKSPACE" show-ref --verify --quiet "$RELEASE_REF"
          git -C "$GITHUB_WORKSPACE" checkout --detach --force "$TRUSTED_MASTER_SHA"

      - name: Set up Go without a GitHub token
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: golang/.go-version
          token: ""
          cache: "false"

      - name: Revalidate immutable publication request
        id: request
        shell: bash
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          RELEASE_PUBLICATION_IMAGE_REPOSITORY: ${{ vars.RELEASE_PUBLICATION_IMAGE_REPOSITORY }}
        run: |
          set -euo pipefail
          bash scripts/release/guard.sh validate-request \
            --release-ref "$RELEASE_REF" \
            --image-reference "$IMAGE_REFERENCE" \
            --evidence-run-id "$EVIDENCE_RUN_ID" \
            --trusted-repository "$RELEASE_PUBLICATION_IMAGE_REPOSITORY" \
            --output "$GITHUB_OUTPUT"

      - name: Reverify public master evidence run metadata
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
          TAG_COMMIT: ${{ steps.request.outputs.tag_commit }}
        run: |
          set -euo pipefail
          bash scripts/release/guard.sh verify-public-run \
            --repository "$REPOSITORY" \
            --evidence-run-id "$EVIDENCE_RUN_ID" \
            --tag-commit "$TAG_COMMIT"

      - name: Redownload named trusted evidence inside protected boundary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.evidence_run_id }}
          path: release-artifacts

      - name: Reverify complete evidence and exact publication digest
        shell: bash
        env:
          IMAGE_REFERENCE: ${{ inputs.image_reference }}
          TAG_COMMIT: ${{ steps.request.outputs.tag_commit }}
        run: |
          set -euo pipefail
          make release-verify
          bash scripts/release/guard.sh verify-evidence \
            --evidence release-artifacts/evidence.json \
            --tag-commit "$TAG_COMMIT" \
            --image-reference "$IMAGE_REFERENCE"

      # Crane is downloaded and checksum-verified before any credential exists.
      - name: Set up pinned digest-preserving image copier
        run: bash scripts/release/setup-crane.sh

      # Every release tool and attestation input is fixed before any cloud
      # identity exists.
      - name: Set up pinned keyless signing client before cloud credentials
        uses: sigstore/cosign-installer@d7543c93d881b35a8faa02e8e3605f69b7a1ce62 # v3.10.0
        with:
          cosign-release: v3.1.3

      - name: Write closed SLSA provenance predicate before cloud credentials
        shell: bash
        env:
          RELEASE_REF: ${{ steps.release-ref.outputs.release_ref }}
          TAG_COMMIT: ${{ steps.request.outputs.tag_commit }}
          IMAGE_DIGEST: ${{ steps.request.outputs.image_digest }}
          EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
        run: |
          set -euo pipefail
          python3 scripts/release/write-provenance.py \
            --output "$RUNNER_TEMP/provenance.slsa.json" \
            --version "${RELEASE_REF#refs/tags/}" \
            --revision "$TAG_COMMIT" \
            --source "https://github.com/${GITHUB_REPOSITORY}" \
            --created "$(git show -s --format=%cI "$TAG_COMMIT")" \
            --digest "$IMAGE_DIGEST" \
            --evidence-run-id "$EVIDENCE_RUN_ID" \
            --workflow-run-id "$GITHUB_RUN_ID"

      # Materialize and digest the complete source graph before an AWS identity
      # exists. Publication never contacts the source registry after this step.
      - name: Stage complete evidence-bound OCI layout before OIDC
        shell: bash
        env:
          SOURCE_IMAGE_REFERENCE: ${{ inputs.image_reference }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.request.outputs.image_digest }}
          STAGED_OCI_LAYOUT: ${{ runner.temp }}/source.oci
        run: bash scripts/release/stage-image.sh

      - name: Acquire short-lived AWS publication identity
        id: aws
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 900
          role-session-name: llmtw-release-${{ github.run_id }}
          unset-current-credentials: "true"
          mask-aws-account-id: "true"

      - name: Authenticate Docker client to the selected private ECR registry
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        with:
          registries: ${{ steps.aws.outputs.aws-account-id }}
          mask-password: "true"

      - name: Push staged evidence-bound manifest recursively by digest
        id: publish
        shell: bash
        env:
          STAGED_OCI_LAYOUT: ${{ runner.temp }}/source.oci
          EXPECTED_IMAGE_DIGEST: ${{ steps.request.outputs.image_digest }}
          AWS_ECR_PUBLISH_ROLE_ARN: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          AWS_ACCOUNT_ID: ${{ steps.aws.outputs.aws-account-id }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          # The ECR login action has already installed one masked Docker
          # credential. Do not expose the OIDC-derived AWS session to shell.
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: bash scripts/release/publish-ecr.sh

      - name: Keyless-sign image, SBOM, and SLSA provenance
        shell: bash
        env:
          COSIGN_YES: "true"
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.published_image }}
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: |
          set -euo pipefail
          cosign sign "$PUBLISHED_IMAGE"
          cosign attest --type cyclonedx \
            --predicate release-artifacts/sbom.cdx.json \
            "$PUBLISHED_IMAGE"
          cosign attest --type slsaprovenance \
            --predicate "$RUNNER_TEMP/provenance.slsa.json" \
            "$PUBLISHED_IMAGE"

      - name: Verify exact GitHub workflow identity and every signed subject
        shell: bash
        env:
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.published_image }}
          EXPECTED_CERTIFICATE_IDENTITY: https://github.com/mfow/llm-temporal-worker/.github/workflows/release.yml@refs/heads/master
          EXPECTED_OIDC_ISSUER: https://token.actions.githubusercontent.com
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: |
          set -euo pipefail
          identity=(--certificate-identity "$EXPECTED_CERTIFICATE_IDENTITY" --certificate-oidc-issuer "$EXPECTED_OIDC_ISSUER")
          cosign verify "${identity[@]}" "$PUBLISHED_IMAGE"
          cosign verify-attestation "${identity[@]}" --type cyclonedx "$PUBLISHED_IMAGE"
          cosign verify-attestation "${identity[@]}" --type slsaprovenance "$PUBLISHED_IMAGE"

      - name: Create immutable semantic tag only after signature verification
        id: finalize
        shell: bash
        env:
          PUBLISHED_IMAGE: ${{ steps.publish.outputs.published_image }}
          EXPECTED_IMAGE_DIGEST: ${{ steps.request.outputs.image_digest }}
          RELEASE_REF: ${{ steps.release-ref.outputs.release_ref }}
          ECR_REGISTRY: ${{ steps.ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: bash scripts/release/finalize-ecr-tag.sh

      - name: Remove staged OCI layout
        if: always()
        shell: bash
        env:
          STAGED_OCI_LAYOUT: ${{ runner.temp }}/source.oci
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
        run: rm -rf -- "$STAGED_OCI_LAYOUT"
