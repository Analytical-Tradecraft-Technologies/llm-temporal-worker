name: Temporary fuzz comparison
on:
  pull_request:
    paths:
      - golang/scripts/run-fuzz.sh
      - .github/workflows/ci-fuzz-comparison.yml
permissions:
  contents: read
jobs:
  compare:
    name: Fuzz ${{ matrix.variant }} shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        variant: [control, balanced]
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 2
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: golang/.go-version
          cache: true
          cache-dependency-path: golang/go.sum
      - name: Select immutable control script
        if: matrix.variant == 'control'
        run: git show 49c089b7d7898cee96c587c5e70b233aeaa23f92 > golang/scripts/run-fuzz.sh
      - name: Run unchanged execution budget
        working-directory: golang
        run: FUZZ_TIME=250000x bash scripts/run-fuzz.sh shard "${{ matrix.shard }}"
