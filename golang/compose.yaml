name: llmtw

services:
  postgres:
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${LLMTW_POSTGRES_PASSWORD:-local-only}
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  # Worker state is isolated from Temporal's database and role. The durable
  # worker profile uses PostgreSQL 17.5 for PostgreSQL-authoritative
  # operations, continuations, results, and control-plane state; Redis remains
  # the active budget/throttle dependency. Keep this pin independent from the
  # Temporal-owned PostgreSQL service above.
  worker-postgres:
    profiles: [durable]
    image: postgres:17.5-alpine@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa
    environment:
      POSTGRES_USER: ${LLMTW_WORKER_POSTGRES_USER:-llmtw_worker}
      POSTGRES_PASSWORD: ${LLMTW_WORKER_POSTGRES_PASSWORD:-local-only}
      POSTGRES_DB: ${LLMTW_WORKER_POSTGRES_DATABASE:-llmtw_worker}
    volumes:
      - worker-postgres-data-v17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 5s

  temporal:
    image: temporalio/auto-setup:1.28.1@sha256:607d68caa111338d754771efb876c92dfcdae06d056e4530bb31cd0f37406e6a
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${LLMTW_POSTGRES_PASSWORD:-local-only}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/config/dynamicconfig/docker.yaml
    ports:
      - "127.0.0.1:${LLMTW_COMPOSE_TEMPORAL_PORT:-0}:7233"
      - "127.0.0.1:${LLMTW_COMPOSE_TEMPORAL_UI_PORT:-0}:8233"
    healthcheck:
      # Docker healthchecks do not inherit entrypoint exports. Recompute the
      # address exactly as the pinned image's entrypoint does, then use its
      # semantic server-readiness predicate.
      test: ["CMD-SHELL", "BIND_ON_IP=\"$$(getent hosts \"$$(hostname)\" | awk '{print $$1;}')\"; case \"$$BIND_ON_IP\" in *:*) TEMPORAL_ADDRESS=\"[$$BIND_ON_IP]:7233\" ;; *) TEMPORAL_ADDRESS=\"$$BIND_ON_IP:7233\" ;; esac; TEMPORAL_ADDRESS=\"$$TEMPORAL_ADDRESS\" temporal operator cluster health | grep -q SERVING"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s

  redis:
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    # Generate the ACL before passing control to the image entrypoint. The
    # entrypoint then initializes the mounted /data volume and drops to redis.
    working_dir: /data
    environment:
      REDIS_USERNAME: ${LLMTW_REDIS_USERNAME:-local}
      REDIS_PASSWORD: ${LLMTW_REDIS_PASSWORD:-local-only}
      REDIS_KEY_PREFIX: ${LLMTW_REDIS_KEY_PREFIX:-llmtw}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        umask 077
        acl_file="$$(mktemp /tmp/llmtw-users.XXXXXX)"
        chmod 0600 "$${acl_file}"
        printf '%s\n' 'user default off' > "$${acl_file}"
        printf 'user %s on >%s ~%s:* +@all\n' "$${REDIS_USERNAME}" "$${REDIS_PASSWORD}" "$${REDIS_KEY_PREFIX}" >> "$${acl_file}"
        chown redis "$${acl_file}"
        exec /usr/local/bin/docker-entrypoint.sh redis-server \
          --appendonly yes \
          --save 60 1 \
          --maxmemory-policy noeviction \
          --aclfile "$${acl_file}"
    command: []
    ports:
      - "127.0.0.1:${LLMTW_COMPOSE_REDIS_PORT:-0}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      # Keep the local dependency contract as strict as worker readiness. The
      # worker profile must not start against an evicting or non-persistent
      # Redis instance.
      test: ["CMD-SHELL", 'redis-cli --user "$${REDIS_USERNAME}" --pass "$${REDIS_PASSWORD}" ping | grep -qx PONG && test "$$(redis-cli --raw --user "$${REDIS_USERNAME}" --pass "$${REDIS_PASSWORD}" CONFIG GET maxmemory-policy | tail -n1)" = noeviction && test "$$(redis-cli --raw --user "$${REDIS_USERNAME}" --pass "$${REDIS_PASSWORD}" CONFIG GET appendonly | tail -n1)" = yes && test -n "$$(redis-cli --raw --user "$${REDIS_USERNAME}" --pass "$${REDIS_PASSWORD}" CONFIG GET save | tail -n1)"']
      interval: 5s
      timeout: 3s
      retries: 24

  # Runtime only verifies this immutable library. The worker profile starts
  # this explicit local-stack provisioner after Redis is healthy and before
  # the worker may poll. Existing libraries are deliberately left unchanged;
  # readiness will fail closed if a retained local volume has the wrong code.
  redis-function-provisioner:
    profiles: [worker]
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_USERNAME: ${LLMTW_REDIS_USERNAME:-local}
      REDIS_PASSWORD: ${LLMTW_REDIS_PASSWORD:-local-only}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        load_function() {
          library="$${1}"
          version="$${2}"
          source="$${3}"
          if redis-cli -h redis --user "$${REDIS_USERNAME}" --pass "$${REDIS_PASSWORD}" --raw FUNCTION LIST LIBRARYNAME "$${library}" | grep -Fxq "$${library}"; then
            echo "Redis Function $${library} already exists; leaving it unchanged"
            return 0
          fi
          {
            printf '%s\n' "#!lua name=$${library}"
            printf '%s\n' "redis.register_function('$${version}', function(KEYS, ARGV)"
            cat "$${source}"
            printf '\nend)\n'
          } | redis-cli -h redis --user "$${REDIS_USERNAME}" --pass "$${REDIS_PASSWORD}" -x FUNCTION LOAD
        }
        load_function llmtw_admission_v1 admission_v1 /opt/llmtw/functions/admission.lua
        load_function llmtw_throttle_v1 throttle_v1 /opt/llmtw/functions/throttle.lua
    volumes:
      - type: bind
        source: ./storage/redis/functions/admission.lua
        target: /opt/llmtw/functions/admission.lua
        read_only: true
      - type: bind
        source: ./storage/redis/functions/throttle.lua
        target: /opt/llmtw/functions/throttle.lua
        read_only: true

  provider-mock:
    build:
      context: ./deploy/local/provider-mock
    image: ${LLMTW_PROVIDER_MOCK_IMAGE:-llmtw/provider-mock:local}
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,urllib.request; urllib.request.urlopen('https://127.0.0.1:8081/health', context=ssl._create_unverified_context())"]
      interval: 5s
      timeout: 3s
      retries: 12

  # A development file blob store is deliberately a separate named volume:
  # Redis is durable admission state, while results and continuations are
  # content-addressed blobs. The worker runs as UID 65532, so provision its
  # writable root before the read-only worker starts.
  blob-volume-provisioner:
    profiles: [worker]
    image: redis:7.4.2-alpine@sha256:02419de7eddf55aa5bcf49efb74e88fa8d931b4d77c07eff8a6b2144472b6952
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /var/lib/llmtw/blobs
        chown 65532:65532 /var/lib/llmtw/blobs
        chmod 0700 /var/lib/llmtw/blobs
    volumes:
      - blob-data:/var/lib/llmtw/blobs

  # The worker is opt-in because it requires a locally generated continuation
  # key. Start the dependencies with `docker compose up -d`, then run
  # `mkdir -p .local && openssl rand -hex 32 > .local/continuation-hmac` and
  # `docker compose --profile worker up worker`. The checked-in provider mock
  # is intentionally Docker-private and is denied by the provider egress
  # policy, so this profile proves boot/readiness rather than live inference.
  # The mounted development config is intentionally a parser/configuration/
  # readiness fixture. Without a durable V1Runtime it omits v1 Activity
  # registration and cannot dispatch inference; every other environment keeps
  # the production startup guard.
  worker:
    profiles: [worker]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
        REVISION: working-tree
        BUILD_TIME: reproducible-local
    image: ${LLMTW_WORKER_IMAGE:-llmtw/worker:local}
    command: ["worker", "--config", "/etc/llmtw/config.yaml"]
    depends_on:
      temporal:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-function-provisioner:
        condition: service_completed_successfully
      blob-volume-provisioner:
        condition: service_completed_successfully
      provider-mock:
        condition: service_healthy
    environment:
      MOCK_API_KEY: local-only
      REDIS_USERNAME: ${LLMTW_REDIS_USERNAME:-local}
      REDIS_PASSWORD: ${LLMTW_REDIS_PASSWORD:-local-only}
      LLMTW_REDIS_KEY_PREFIX: ${LLMTW_REDIS_KEY_PREFIX:-llmtw}
      AWS_EC2_METADATA_DISABLED: "true"
    secrets:
      - source: continuation_hmac
        target: /var/run/secrets/llmtw/continuation-hmac
    volumes:
      - type: bind
        source: ./deploy/local/config.yaml
        target: /etc/llmtw/config.yaml
        read_only: true
      - type: bind
        source: ./deploy/local/capabilities.yaml
        target: /etc/llmtw/capabilities.yaml
        read_only: true
      - type: bind
        source: ./deploy/local/prices.yaml
        target: /etc/llmtw/prices.yaml
        read_only: true
      - blob-data:/var/lib/llmtw/blobs
      - type: tmpfs
        target: /tmp
        tmpfs:
          size: 134217728
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:${LLMTW_COMPOSE_HEALTH_PORT:-0}:8080"
      - "127.0.0.1:${LLMTW_COMPOSE_METRICS_PORT:-0}:9090"
    healthcheck:
      test: ["CMD", "/usr/local/bin/llm-temporal-worker", "healthcheck", "--url", "http://127.0.0.1:8080/health/live", "--url", "http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 20s
    stop_grace_period: 90s

  # This profile validates the durable worker configuration against the
  # isolated worker database and Redis dependency model. Schema installation
  # remains an explicit deployment step; the normal worker profile continues
  # to use the offline Redis fixture above.
  durable-worker:
    profiles: [durable]
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: local
        REVISION: working-tree
        BUILD_TIME: reproducible-local
    image: ${LLMTW_WORKER_IMAGE:-llmtw/worker:local}
    command: ["validate-config", "--config", "/etc/llmtw/durable-config.yaml"]
    depends_on:
      worker-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      WORKER_POSTGRES_USERNAME: ${LLMTW_WORKER_POSTGRES_USER:-llmtw_worker}
      WORKER_POSTGRES_PASSWORD: ${LLMTW_WORKER_POSTGRES_PASSWORD:-local-only}
      LLMTW_REDIS_KEY_PREFIX: ${LLMTW_REDIS_KEY_PREFIX:-llmtw}
    volumes:
      - type: bind
        source: ./deploy/local/durable-config.yaml
        target: /etc/llmtw/durable-config.yaml
        read_only: true
      - type: bind
        source: ./deploy/local/capabilities.yaml
        target: /etc/llmtw/capabilities.yaml
        read_only: true
      - type: bind
        source: ./deploy/local/prices.yaml
        target: /etc/llmtw/prices.yaml
        read_only: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

secrets:
  continuation_hmac:
    file: ${LLMTW_CONTINUATION_KEY_FILE:-./.local/continuation-hmac}

volumes:
  blob-data:
  redis-data:
  temporal-postgres-data:
  worker-postgres-data-v17:
