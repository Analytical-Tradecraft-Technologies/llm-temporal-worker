apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: llmtw-worker
spec:
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
    - ports:
        - port: 6379
          protocol: TCP
        - port: 5432
          protocol: TCP
        - port: 7233
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              llmtw.io/state-egress: allowed
        # Replace this example with the narrow private CIDR(s) allocated to
        # the reviewed Redis, PostgreSQL, and Temporal endpoints.
        - ipBlock:
            cidr: 10.64.0.0/16
    - ports:
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 169.254.169.254/32
